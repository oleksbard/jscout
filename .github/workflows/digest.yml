name: digest
on:
  schedule:
    # 08:30 Berlin (summer). Winter: 07:30 — accepted.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: job-scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit state
        # always(): a failed run still persists partial state (run.ts saves in a finally block).
        if: always()
        run: |
          git config user.name "job-scout-bot"
          git config user.email "job-scout-bot@users.noreply.github.com"
          git add state matches
          git diff --cached --quiet || git commit -m "chore: state update (digest) [skip ci]"
          git pull --rebase origin main
          git push
